[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophis"
version = "0.1.0"
description = "Linux control center for the Razer Blade 14 (2022): performance profiles, fan curves, per-key RGB and charge limit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TheYamo" }]
keywords = ["razer", "blade", "linux", "fan-control", "rgb", "hidraw", "gtk4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/EpicYamo/ophis"
Issues = "https://github.com/EpicYamo/ophis/issues"

[project.scripts]
ophis = "ophis.cli:main"
ophis-gui = "ophis.gui.app:main"
ophis-tray = "ophis.tray:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
